[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-investigation-ai-agent"
version = "1.0.0"
description = "Autonomous Graph-Powered Multi-Agent Fraud Investigation AI Agent with TigerGraph, LangGraph, and GraphRAG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ayush Kanyal" }
]
dependencies = [
    "pyTigerGraph>=1.5.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=2.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.26.0,<2.3.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "starlette>=0.36.0"
]


[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.9"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "schema*", "queries*", "data_loading*"]

[tool.setuptools]
py-modules = ["config", "app", "run_cases", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

