name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Run Test Suite (Offline)
      env:
        AUTH_DISABLED: "true"
        DATA_REPOSITORY_BACKEND: "local"
        SIMULATION_MODE: "true"
      run: |
        pytest tests/test_startup_smoke.py tests/test_policy.py tests/test_validator.py tests/test_persistence.py tests/test_api.py tests/test_repository_local.py tests/test_baseline.py tests/test_episode_detection.py tests/test_repository_parity.py tests/test_customer_simulator.py tests/test_evidence_workflow.py tests/test_claim_validator.py tests/test_llm_resilience.py
