name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"


    - name: Run Test Suite (Offline)
      env:
        DATA_REPOSITORY_BACKEND: "local"
        SIMULATION_MODE: "true"
        API_AUTH_KEY: "test-ci-api-key-32-chars-long-secure"
        CHECKPOINT_BACKEND: "sqlite"
      run: |
        pytest tests/test_startup_smoke.py \
               tests/test_policy.py \
               tests/test_validator.py \
               tests/test_persistence.py \
               tests/test_api.py \
               tests/test_repository_local.py \
               tests/test_baseline.py \
               tests/test_episode_detection.py \
               tests/test_repository_parity.py \
               tests/test_customer_simulator.py \
               tests/test_evidence_workflow.py \
               tests/test_claim_validator.py \
               tests/test_llm_resilience.py \
               tests/test_audit_chain.py \
               tests/test_tigergraph_fallback.py \
               tests/test_checkpoints_db.py \
               tests/test_token_tracker.py \
               tests/test_evidence_classifier.py \
               tests/test_tigergraph_parity_live.py

