name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"


    - name: Run Unit & Regression Test Suite
      env:
        DATA_REPOSITORY_BACKEND: "local"
        SIMULATION_MODE: "true"
        API_AUTH_KEY: "test-ci-api-key-32-chars-long-secure"
        CHECKPOINT_BACKEND: "sqlite"
      run: |
        pytest -v

    - name: Run 7-Dimension Quantitative Evaluation Suite
      run: |
        python -m eval.run_eval --fail-below 85.0

    - name: Publish Evaluation Summary to GitHub Actions Summary
      if: always()
      run: |
        if [ -f "eval/results/eval_summary.md" ]; then
          cat eval/results/eval_summary.md >> $GITHUB_STEP_SUMMARY
        fi

